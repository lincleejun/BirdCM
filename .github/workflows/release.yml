# Release 观羽 for macOS when a release/vX.Y.Z tag is pushed; nothing else triggers it. docs/release.md
# Manual run (Actions → release → Run workflow) with dry_run (default) = rehearsal: tests, build, the dmg as a
# workflow artifact and the notes in the run summary, no release. dry_run off on a release/v* tag re-releases that tag.
name: release

on:
  push:
    tags: ['release/v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearsal: test and build only, create no release'
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # -eo pipefail

env:
  # caches (uv wheels + python-build-standalone, npm, exiftool): only runs on main may save them, so a rehearsal on main
  # warms them; a tag run can read main's caches but not another tag's (GitHub docs: "Restrictions for accessing a cache")
  SAVE_CACHE: ${{ github.ref == 'refs/heads/main' }}

jobs:
  gate:
    # Apple Silicon, 3 CPU / 7 GB: https://docs.github.com/en/actions/reference/runners/github-hosted-runners
    # macos-15, not macos-latest: the app promises macOS 15+, build there.
    runs-on: macos-15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" = false ] && [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "::error::a real release needs a release/v* tag: choose the tag under 'Use workflow from', or keep dry_run"; exit 1
          fi
          .github/release-version.sh "$GITHUB_REF" | tee -a "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.9.26
          enable-cache: true          # 'auto' would skip tag pushes
          save-cache: ${{ env.SAVE_CACHE }}
          cache-dependency-glob: engine/uv.lock
          cache-suffix: gate
      - name: engine tests (model and sample-photo tests skip here)
        working-directory: engine
        run: uv run --locked pytest -rs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: web build
        working-directory: web
        run: npm ci --no-audit --no-fund && npm run build

  build:
    needs: gate
    runs-on: macos-15
    permissions:
      contents: read
    env:
      V: ${{ needs.gate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.9.26
          enable-cache: true
          save-cache: ${{ env.SAVE_CACHE }}
          cache-python: true          # build.sh's `uv python install 3.12.11` (python-build-standalone)
          cache-dependency-glob: engine/uv.lock
          cache-suffix: build
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: restore exiftool tarball
        id: exiftool
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.cache
          key: exiftool-${{ hashFiles('macos/build.sh') }}   # the pinned version + sha256 live in build.sh
      - name: build.sh (ad-hoc signed, not notarised)
        run: macos/build.sh
      - if: env.SAVE_CACHE == 'true' && steps.exiftool.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: macos/.cache
          key: exiftool-${{ hashFiles('macos/build.sh') }}
      - name: check the dmg, checksum, ASCII name for the artifact
        working-directory: macos/dist
        run: |
          hdiutil verify -quiet "观羽-$V-arm64.dmg"
          mv "观羽-$V-arm64.dmg" "GuanYu-$V-arm64.dmg"     # same bytes; the release job uploads both names
          sum=$(shasum -a 256 "GuanYu-$V-arm64.dmg" | cut -d' ' -f1)
          printf '%s  %s\n' "$sum" "观羽-$V-arm64.dmg" "$sum" "GuanYu-$V-arm64.dmg" > "GuanYu-$V-arm64.dmg.sha256"
          cat "GuanYu-$V-arm64.dmg.sha256"; ls -l
          echo "dmg $(du -h "GuanYu-$V-arm64.dmg" | cut -f1), sha256 $sum" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: |
            macos/dist/GuanYu-${{ needs.gate.outputs.version }}-arm64.dmg
            macos/dist/GuanYu-${{ needs.gate.outputs.version }}-arm64.dmg.sha256
          compression-level: 0        # a dmg is already compressed
          retention-days: 14
          if-no-files-found: error

  release:
    needs: [gate, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # create the release and upload assets; nothing else anywhere
    env:
      V: ${{ needs.gate.outputs.version }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      PUBLISH: ${{ github.ref_type == 'tag' && (github.event_name == 'push' || !inputs.dry_run) }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0              # history and tags for the notes
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: out
      - name: notes
        run: |
          .github/release-notes.sh "$V" > notes.md
          cp "out/GuanYu-$V-arm64.dmg" "out/观羽-$V-arm64.dmg"
          { echo "## 观羽 v$V (prerelease: $PRERELEASE, publish: $PUBLISH)"; du -h out/* | sed 's/^/    /'; echo; cat notes.md; } >> "$GITHUB_STEP_SUMMARY"
      - name: create the release (draft, upload, check names, publish)
        if: env.PUBLISH == 'true'
        run: |
          tag="release/v$V" zh="观羽-$V-arm64.dmg" ascii="GuanYu-$V-arm64.dmg"
          # a draft left by a failed run is replaced; a published release is never touched (create fails instead)
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then gh release delete "$tag" --yes; fi
          flags=(); [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$tag" --verify-tag --draft --title "观羽 v$V" --notes-file notes.md "${flags[@]}" \
            "out/$ascii" "out/$ascii.sha256" "out/$zh"
          names=$(gh release view "$tag" --json assets --jq '.assets[].name')
          echo "assets as GitHub stored them:"; echo "$names"
          if ! grep -qxF "$zh" <<<"$names"; then
            # GitHub renames asset files with "special characters, non-alphanumeric characters" (REST docs, release assets);
            # a renamed copy would only confuse, so drop it and keep the ASCII alias
            renamed=$(grep -vxF -e "$ascii" -e "$ascii.sha256" <<<"$names")
            echo "::warning::GitHub stored $zh as '$renamed'; removed it, $ascii is the download"
            gh release delete-asset "$tag" "$renamed" --yes
          fi
          gh release edit "$tag" --draft=false
          { echo; echo "Published: $(gh release view "$tag" --json url --jq .url)"; echo "Assets:"
            gh release view "$tag" --json assets --jq '.assets[] | "- \(.name) (\(.size) bytes)"'; } >> "$GITHUB_STEP_SUMMARY"
