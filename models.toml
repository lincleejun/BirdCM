# BirdCM model manifest. `birdcm models fetch` downloads what is missing into ~/Library/Caches/BirdCM/models
# (sha256-checked); BIRDCM_MODEL_DIR=dir1:dir2 lets development point at local copies (also sha256-checked).
#
# OWLv2's processor/config files are not listed: the 414-byte config.json of google/owlv2-base-patch16-ensemble
# at revision cfd3195ba4ea9592eec887ded089f4c08eff231d is all defaults plus four values, inlined in detect.py,
# and the one prompt "a bird" is pre-tokenised there (see docs/deviations.md). Nothing is fetched at run time.
#
# Not yet listed (no released file): the aesthetic head (block-15 ridge head, distill/aesthetic.py fits it at
# run time from EVA), the rarity table, BirdNET geo data. Their steps report "待定".

