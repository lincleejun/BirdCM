[project]
name = "birdcm"
version = "0.1.0"
description = "BirdCM (观羽): local bird photo culling and identification engine"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.6",
    "open-clip-torch>=3.3,<4",
    "transformers>=4.51,<6",
    "safetensors>=0.5",
    "rawpy==0.27.1",
    "pillow>=11.0",
    "numpy>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "opencv-python-headless>=4.10",
    "python-multipart>=0.0.9",
    "onnxruntime>=1.18",
]

[project.scripts]
birdcm = "birdcm.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "psutil>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["birdcm"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
